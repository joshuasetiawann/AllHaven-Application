name: Build Android APK

# Builds the AllHaven mobile app into an installable .apk on GitHub's runners —
# no Android Studio or SDK needed on your machine. The .apk is attached to every
# run as a downloadable artifact, and (when a real API URL is given) published to
# the "mobile-latest" pre-release for a permanent download link.
#
# Run it: Actions tab → "Build Android APK" → Run workflow, and enter your API
# base URL (e.g. https://yourdomain.com/api/v1). Or set the repo variable
# MOBILE_API_BASE_URL once (Settings → Secrets and variables → Actions → Variables)
# and just press Run.

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend API base URL the APK points at (e.g. https://yourdomain.com/api/v1)"
        required: false
        default: ""
  # Manual trigger only: run it after deploying the backend and setting the
  # MOBILE_API_BASE_URL repo variable, so each APK points at a real backend
  # (auto-building on every push would waste minutes on placeholder APKs).

permissions:
  contents: write # needed to publish the apk to a Release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Empty by default, on purpose. A public APK must not carry anyone's
      # backend address: publishing it exposes that machine's hostname, and every
      # installer would have their phone pointed at someone else's computer.
      # With no address the app asks for one in Settings -> Backend Bridge, and
      # still works on its own for everything that reads the workspace database.
      # Pass api_base_url when running the workflow to build a private APK.
      API_URL: ${{ github.event.inputs.api_base_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # Capacitor 8 CLI requires Node >= 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # Capacitor 8 / AGP compiles with source release 21

      - uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        run: npm ci

      - name: Build static export + sync Capacitor
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # build:mobile sets NEXT_PUBLIC_AUTH_MODE=bearer + NEXT_PUBLIC_DATA_MODE=supabase
        run: |
          echo "Building Supabase-mode APK"
          npm run build:mobile
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: allhaven-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish to "mobile-latest" release (download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: Android APK - mobile companion (not the desktop app)
          prerelease: true
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            **This is the Android companion app.** For AllHaven on a computer, follow the Quick Start in the README instead.

            Download `app-debug.apk` below, enable *Install unknown apps*, and open it.

            The app ships with no backend address - set one in **Settings -> Backend Bridge**, or use it on its own with your own provider keys under **Settings -> On-device AI keys**.

            Debug build, signed with a debug key - for personal and testing use.